windows:
  - id: header
    pos: topLeft
    size: { fillWidth: 1 }
    background: 24

  - id: statusBar
    pos: { preset: bottom }
    size: { fillWidth: 1 }
    background: 24

  - id: dialog
    pos: center
    size: { width: "90%", height: "92%" }
    background: 236
    border:
      top: true
      right: true
      bottom: true
      left: true
      style: rounded
      color: 240
    content: "  Controls demo"
    children:

      # ── Top-left: text inputs + checkboxes ───────────────────────────────────
      - id: leftPanel
        pos: { x: 1, y: 2 }
        size: { width: "46%", height: "43%" }
        background: 235
        border: { top: true, right: true, bottom: true, left: true, style: single, color: 238 }
        content: "Personal info"
        children:
          - id: tbUsername
            type: textbox
            pos: { x: 0, y: 2 }
            size: { fillWidth: 3 }
            value: "jan_kowalski"
            placeholder: "username"
            focused: true
          - id: tbEmail
            type: textbox
            pos: { x: 0, y: 5 }
            size: { fillWidth: 3 }
            value: "jan@example.com"
            placeholder: "e-mail"
          - id: cb1
            type: checkbox
            pos: { x: 1, y: 9 }
            label: "Enable notifications"
            checked: true
          - id: cb2
            type: checkbox
            pos: { x: 1, y: 10 }
            label: "Dark mode"
            checked: true
          - id: cb3
            type: checkbox
            pos: { x: 1, y: 11 }
            label: "Beta features"
          - id: cb4
            type: checkbox
            pos: { x: 1, y: 12 }
            label: "Telemetry (disabled)"
            disabled: true

      # ── Top-right: language radios + service status LEDs ─────────────────────
      - id: rightPanel
        pos: { x: "50%", y: 2 }
        size: { width: "48%", height: "43%" }
        background: 235
        border: { top: true, right: true, bottom: true, left: true, style: single, color: 238 }
        content: "Preferences"
        children:
          - id: r1
            type: radio
            pos: { x: 1, y: 2 }
            label: "English"
            checked: true
          - id: r2
            type: radio
            pos: { x: 1, y: 3 }
            label: "Polski"
            focused: true
          - id: r3
            type: radio
            pos: { x: 1, y: 4 }
            label: "Deutsch"
          - id: r4
            type: radio
            pos: { x: 1, y: 5 }
            label: "Français (disabled)"
            disabled: true
          - id: ledApi
            type: statusled
            pos: { x: 1, y: 8 }
            state: ok
            label: "API Server"
          - id: ledDb
            type: statusled
            pos: { x: 1, y: 9 }
            state: ok
            label: "Database"
          - id: ledCache
            type: statusled
            pos: { x: 1, y: 10 }
            state: warn
            label: "Cache"
          - id: ledWorker
            type: statusled
            pos: { x: 1, y: 11 }
            state: error
            label: "Worker"

      # ── Bottom-left: resource progress bars ──────────────────────────────────
      - id: monitorPanel
        pos: { x: 1, y: "46%" }
        size: { width: "46%", height: "43%" }
        background: 235
        border: { top: true, right: true, bottom: true, left: true, style: single, color: 238 }
        content: "Resources"
        children:
          - id: pbCpu
            type: progressbar
            pos: { x: 0, y: 2 }
            size: { width: "78%", height: 1 }
            barValue: 73
            max: 100
            fillColor: 75
          - id: pbMem
            type: progressbar
            pos: { x: 0, y: 4 }
            size: { width: "78%", height: 1 }
            barValue: 45
            max: 100
            fillColor: 82
          - id: pbDisk
            type: progressbar
            pos: { x: 0, y: 6 }
            size: { width: "78%", height: 1 }
            barValue: 88
            max: 100
            fillColor: 214
          - id: pbvLoad
            type: progressbarv
            pos: { x: -4, y: 1 }
            size: { width: 3, height: "82%" }
            barValue: 68
            max: 100
            fillColor: 75

      # ── Bottom-right: line chart + bar chart ──────────────────────────────────
      - id: chartsPanel
        pos: { x: "50%", y: "46%" }
        size: { width: "48%", height: "43%" }
        background: 235
        border: { top: true, right: true, bottom: true, left: true, style: single, color: 238 }
        content: "Charts"
        children:
          - id: lineChart
            type: linechart
            pos: { x: 0, y: 0 }
            size: { fillHeight: "56%" }
          - id: barChart
            type: barchart
            pos: { x: "58%", y: 0 }
            size: { fillHeight: "40%" }
            barWidth: 2

      # ── Buttons ───────────────────────────────────────────────────────────────
      - id: btnDisabled
        type: button
        pos: { x: 1, y: -4 }
        size: { width: 11, height: 3 }
        label: "Delete"
        disabled: true
      - id: btnCancel
        type: button
        pos: { x: -15, y: -4 }
        size: { width: 11, height: 3 }
        label: "Cancel"
      - id: btnSave
        type: button
        pos: { x: -27, y: -4 }
        size: { width: 11, height: 3 }
        label: " Save"
