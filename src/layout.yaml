windows:
  - id: header
    pos: topLeft
    size: { fillWidth: 1 }
    background: 24
    children:
      - id: headerSpinner
        type: spinner
        pos: { x: -1, y: 0 }
        spinnerStyle: braille
        label: "LIVE"
        chartColor: 231

  - id: statusBar
    pos: { preset: bottom }
    size: { fillWidth: 1 }
    background: 24

  - id: dialog
    pos: center
    size: { width: "90%", height: "92%" }
    background: 236
    border:
      top: true
      right: true
      bottom: true
      left: true
      style: rounded
      color: 240
    content: "  Controls demo"
    children:

      # ── Top-left: text inputs + checkboxes ───────────────────────────────────
      - id: leftPanel
        pos: { x: 1, y: 2 }
        size: { width: "46%", height: "43%" }
        background: 235
        # Demonstrates the per-character override: the corners are swapped for diamond glyphs
        # while the rest of the 'single' style is kept untouched.
        border: { top: true, right: true, bottom: true, left: true, style: single, color: 238,
                  chars: { topLeft: '◆', topRight: '◆' } }
        content: "Personal info"
        children:
          - id: tbUsername
            type: textbox
            pos: { x: 0, y: 2 }
            size: { fillWidth: 3 }
            value: "jan_kowalski"
            placeholder: "username"
            focused: true
            # P0-6: YAML-wired onSubmit — pressing Enter while this TextBox is
            # focused fires `usernameSubmitted`, registered in demo.mts.
            onSubmit: usernameSubmitted
          - id: tbEmail
            type: textbox
            pos: { x: 0, y: 5 }
            size: { fillWidth: 3 }
            value: "jan@example.com"
            placeholder: "e-mail"
          - id: cb1
            type: checkbox
            pos: { x: 1, y: 9 }
            label: "Enable notifications"
            checked: true
          - id: cb2
            type: checkbox
            pos: { x: 1, y: 10 }
            label: "Dark mode"
            checked: true
          - id: cb3
            type: checkbox
            pos: { x: 1, y: 11 }
            label: "Beta features"
          - id: cb4
            type: checkbox
            pos: { x: 1, y: 12 }
            label: "Telemetry (disabled)"
            disabled: true

      # ── Top-right: language radios + service status LEDs ─────────────────────
      - id: rightPanel
        pos: { x: "50%", y: 2 }
        size: { width: "48%", height: "43%" }
        background: 235
        border: { top: true, right: true, bottom: true, left: true, style: single, color: 238 }
        content: "Preferences"
        children:
          - id: r1
            type: radio
            pos: { x: 1, y: 2 }
            label: "English"
            checked: true
          - id: r2
            type: radio
            pos: { x: 1, y: 3 }
            label: "Polski"
            focused: true
          - id: r3
            type: radio
            pos: { x: 1, y: 4 }
            label: "Deutsch"
          - id: r4
            type: radio
            pos: { x: 1, y: 5 }
            label: "Français (disabled)"
            disabled: true
          - id: ledApi
            type: statusled
            pos: { x: 1, y: 8 }
            state: ok
            label: "API Server"
          - id: ledDb
            type: statusled
            pos: { x: 1, y: 9 }
            state: ok
            label: "Database"
          - id: ledCache
            type: statusled
            pos: { x: 1, y: 10 }
            state: warn
            label: "Cache"
          - id: ledWorker
            type: statusled
            pos: { x: 1, y: 11 }
            state: error
            label: "Worker"

      # ── Bottom-left: resource progress bars ──────────────────────────────────
      - id: monitorPanel
        pos: { x: 1, y: "46%" }
        size: { width: "46%", height: "43%" }
        background: 235
        # Demonstrates the new 'thick' (heavy) box-drawing style.
        border: { top: true, right: true, bottom: true, left: true, style: thick, color: 38 }
        content: "Resources"
        children:
          - id: pbCpu
            type: progressbar
            pos: { x: 0, y: 2 }
            size: { width: "78%", height: 1 }
            barValue: 73
            max: 100
            fillColor: 75
          - id: pbMem
            type: progressbar
            pos: { x: 0, y: 4 }
            size: { width: "78%", height: 1 }
            barValue: 45
            max: 100
            fillColor: 82
          - id: pbDisk
            type: progressbar
            pos: { x: 0, y: 6 }
            size: { width: "78%", height: 1 }
            barValue: 88
            max: 100
            fillColor: 214
          - id: pbvLoad
            type: progressbarv
            pos: { x: -4, y: 1 }
            size: { width: 3, height: "82%" }
            barValue: 68
            max: 100
            fillColor: 75

      # ── Bottom-right-left: tabbed charts / trends ────────────────────────────
      - id: chartsPanel
        type: tabs
        pos: { x: "50%", y: "46%" }
        size: { width: "30%", height: "43%" }
        background: 235
        border: { top: true, right: true, bottom: true, left: true, style: single, color: 238 }
        titles: ["Charts", "Trends"]
        activeIndex: 0
        children:
          # ── Tab 0: line + bar charts side by side ────────────────────────────
          - id: lineChart
            type: linechart
            tab: 0
            pos: { x: 0, y: 1 }
            size: { width: "58%", height: "85%" }
          - id: barChart
            type: barchart
            tab: 0
            pos: { x: "60%", y: 1 }
            size: { width: "38%", height: "85%" }
            barWidth: 2

          # ── Tab 1: three stacked sparklines ──────────────────────────────────
          - id: sparkCpu
            type: sparkline
            tab: 1
            pos: { x: 6, y: 2 }
            size: { width: "85%", height: 1 }
            chartColor: 75
          - id: sparkMem
            type: sparkline
            tab: 1
            pos: { x: 6, y: 3 }
            size: { width: "85%", height: 1 }
            chartColor: 82
          - id: sparkDsk
            type: sparkline
            tab: 1
            pos: { x: 6, y: 4 }
            size: { width: "85%", height: 1 }
            chartColor: 214

      # ── Bottom-right-right: permanently visible event log (ListBox) ───────────
      - id: eventsPanel
        pos: { x: "81%", y: "46%" }
        size: { width: "17%", height: "43%" }
        background: 235
        # Demonstrates the new 'dashed' style.
        border: { top: true, right: true, bottom: true, left: true, style: dashed, color: 33 }
        content: "Events"
        children:
          - id: eventsList
            type: listbox
            pos: { x: 0, y: 1 }
            size: { width: "100%", height: "85%" }
            # Items populated at runtime via ListBox.setItems() with structured EventRow objects;
            # a demo.mts renderItem() draws icon + dimmed timestamp + right-aligned count.

      # ── Buttons ───────────────────────────────────────────────────────────────
      # Bottom action bar — demonstrates P0-3 flex layout. The container uses
      # `layout: row` with `gap: 1`; the middle `spacer` child has `size: flex`
      # (grow=1 by default), so it soaks up leftover inner width between the
      # left-aligned "Delete" and the right-aligned "Cancel" / " Save" group.
      # alignItems: stretch pins children to the row height. This is the same
      # visual outcome as the previous absolute positioning but authored
      # declaratively, and it adapts automatically if the dialog is resized.
      - id: buttonRow
        pos: { x: 0, y: -4 }
        size: { fillWidth: 3 }
        layout: row
        gap: 1
        alignItems: stretch
        children:
          - id: btnDisabled
            type: button
            pos: flex
            size: { width: 11, height: 3 }
            label: "Delete"
            disabled: true
          - id: buttonSpacer
            pos: flex
            size: flex
          - id: btnCancel
            type: button
            pos: flex
            size: { width: 11, height: 3 }
            label: "Cancel"
          - id: btnSave
            type: button
            pos: flex
            size: { width: 11, height: 3 }
            label: " Save"
